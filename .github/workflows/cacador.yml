name: Agente Caçador

on:
  # Cron a cada 2 horas (UTC)
  schedule:
    - cron: "0 */2 * * *"
  # Disparo manual com links colados
  workflow_dispatch:
    inputs:
      links:
        description: "Links de produtos (um por linha)"
        required: true
        type: string
      usuario_id:
        description: "UUID do usuário (opcional — se vazio usa a primeira config ativa)"
        required: false
        type: string
        default: ""

jobs:
  cacador:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Rodar Agente Caçador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINKS: ${{ github.event.inputs.links }}
          USUARIO_ID: ${{ github.event.inputs.usuario_id }}
        run: npm run cacador
